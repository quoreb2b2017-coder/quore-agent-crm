# Static code security scan (backlog item 23). Findings appear under Security > Code scanning.
# Code scanning on a private repository needs GitHub Advanced Security; on a public one it is free.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
